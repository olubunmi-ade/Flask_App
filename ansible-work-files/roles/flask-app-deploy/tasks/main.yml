---
# Task 1: Install required packages (Python, etc.)
- name: Ensure Python and Flask are installed
  yum:
    name: "{{ item }}"
    state: present
  with_items:
    - python3
    - python3-pip

- name: Install Flask and gunicorn
  pip:
    name: "{{ item }}"
    state: present
  with_items:
    - flask
    - gunicorn

# New Task: Install psycopg2 Python library
- name: Install psycopg2 for PostgreSQL connectivity
  ansible.builtin.pip:
    name: psycopg2-binary
    state: present
    executable: pip3

# Task 2: Install and configure PostgreSQL
- name: Install PostgreSQL server
  yum:
    name: postgresql-server
    state: present

- name: Initialize PostgreSQL database
  command: postgresql-setup initdb
  args:
    creates: /var/lib/pgsql/data/postgresql.conf

- name: Start PostgreSQL service
  systemd:
    name: postgresql
    state: started
    enabled: yes

- name: Create database user
  become: yes
  become_user: postgres
  postgresql_user:
    name: devops
    password: 'password'
    state: present

- name: Create PostgreSQL database (devopsdb)
  become: yes
  become_user: postgres
  postgresql_db:
    name: devopsdb               
    owner: devops
    state: present

# New Task: Initialize the database schema (Create tables)
- name: Initialize database schema and tables
  become: yes
  become_user: postgres
  ansible.builtin.shell: |
    psql -d devopsdb -f /var/www/my-flask-app/db/init.sql
  args:
    chdir: /var/lib/pgsql/
    creates: /var/lib/pgsql/data/initialized_db_marker # Prevents rerunning on subsequent runs

# Task 3: Copy and Extract the app artifact
- name: Create app directory
  file:
    path: /var/www/my-flask-app
    state: directory
    mode: '0755'

- name: Copy app artifact
  ansible.builtin.copy:
    src: "{{ artifact_source }}/app.tar.gz" # Path from Jenkins
    dest: /var/www/my-flask-app/app.tar.gz

- name: Extract app artifact
  unarchive:
    src: /var/www/my-flask-app/app.tar.gz
    dest: /var/www/my-flask-app
    remote_src: yes

# Task 4: Configure the app and run it
- name: Set environment variables
  lineinfile:
    path: /etc/environment
    line: "DATABASE_URL=postgresql://devops:password@localhost/devopsdb"
    state: present




# New Task: Create the Gunicorn Systemd service file
- name: Configure Gunicorn Systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/gunicorn.service
    content: |
      [Unit]
      Description=Gunicorn instance to serve my-flask-app
      After=network.target

      [Service]
      User=root
      Group=root
      WorkingDirectory=/var/www/my-flask-app/ 
      EnvironmentFile=/etc/environment
      ExecStart=/usr/local/bin/gunicorn --workers 3 --bind 0.0.0.0:5000 app:app

      [Install]
      WantedBy=multi-user.target
  #notify: Daemon Reload  # <-- Add a handler notification

- name: 2. Start Gunicorn service
  ansible.builtin.systemd:
    name: gunicorn
    state: started # Ensures it is running
    enabled: yes   # Ensures it starts on boot

# Mandatory Task: Reload Systemd daemon after creating the new service file
- name: Daemon Reload
  ansible.builtin.systemd:
    daemon_reload: true
  #listen: "Daemon Reload" # <-- Define the listener name


