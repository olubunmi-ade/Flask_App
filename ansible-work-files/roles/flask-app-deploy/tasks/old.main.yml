---
- vars:
    app_dir: /var/www/my-flask-app
    artifact_file: app.tar.gz
    artifact_source: "{{ artifact_source }}"  # Change this to where Jenkins places the artifact
    db_name: devopsdb
    db_user: devops
    db_password: "{{ db_password }}"   # Use ansible-vault or inventory var
    db_host: localhost
    db_port: 5432
    db_url: "postgresql://{{ db_user }}:{{ db_password }}@{{ db_host }}/{{ db_name }}"

  tasks:
    # ----------------------------
    # Task 1: Python & dependencies
    # ----------------------------
    - name: Ensure Python3 and pip installed
      yum:
        name: 
          - python3
          - python3-pip
        state: present

    - name: Install Flask and Gunicorn
      pip:
        name: 
          - flask
          - gunicorn
        state: present
        executable: pip3

    - name: Install psycopg2 for PostgreSQL connectivity
      pip:
        name: psycopg2-binary
        state: present
        executable: pip3

    # ----------------------------
    # Task 2: PostgreSQL setup
    # ----------------------------
    - name: Install PostgreSQL server
      yum:
        name: postgresql-server
        state: present

    - name: Initialize PostgreSQL database
      command: postgresql-setup initdb
      args:
        creates: /var/lib/pgsql/data/postgresql.conf

    - name: Ensure PostgreSQL is running
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Create database user
      become_user: postgres
      postgresql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        state: present

    - name: Create PostgreSQL database
      become_user: postgres
      postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
        state: present

    - name: Configure PostgreSQL to use MD5 password authentication
      lineinfile:
        path: /var/lib/pgsql/data/pg_hba.conf
        regexp: '^host\s+all\s+all\s+127\.0\.0\.1/32\s+.*$'
        line: 'host    all             all             127.0.0.1/32            md5'
      notify: Restart PostgreSQL

    # ----------------------------
    # Task 3: App setup
    # ----------------------------
    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Copy app artifact
      copy:
        src: "{{ artifact_source }}/{{ artifact_file }}"
        dest: "{{ app_dir }}/{{ artifact_file }}"

    - name: Extract app artifact
      unarchive:
        src: "/var/www/my-flask-app/{{ artifact_file }}"
        dest: "{{ app_dir }}"
        remote_src: yes

    - name: Initialize database schema
      become_user: postgres
      shell: psql -d {{ db_name }} -f {{ app_dir }}/db/init.sql
      args:
        creates: /var/lib/pgsql/data/initialized_db_marker
      register: schema_init
      changed_when: schema_init.rc == 0

    - name: Create initialized marker
      file:
        path: /var/lib/pgsql/data/initialized_db_marker
        state: touch
      when: schema_init is changed

    - name: Set DATABASE_URL environment variable
      lineinfile:
        path: /etc/environment
        line: "DATABASE_URL={{ db_url }}"
        state: present

    # ----------------------------
    # Task 4: Gunicorn service
    # ----------------------------
    - name: Configure Gunicorn Systemd service
      copy:
        dest: /etc/systemd/system/gunicorn.service
        content: |
          [Unit]
          Description=Gunicorn instance to serve my-flask-app
          After=network.target

          [Service]
          User=root
          Group=root
          WorkingDirectory={{ app_dir }}
          EnvironmentFile=/etc/environment
          ExecStart=/usr/local/bin/gunicorn --workers 3 --bind 0.0.0.0:5000 app:app

          [Install]
          WantedBy=multi-user.target
      notify: Daemon Reload

    - name: Start and enable Gunicorn
      systemd:
        name: gunicorn
        state: started
        enabled: yes

  handlers:
    - name: Restart PostgreSQL
      systemd:
        name: postgresql
        state: restarted

    - name: Daemon Reload
      systemd:
        daemon_reload: true
